<script>
const POSTS = [{"c": "后端工程", "d": "2026-11-18", "r": 12, "t": "用不可变 revision 重写 CMS 的发布流程", "e": "把「保存」「批准」「上线」拆成三个独立状态。旧版本在新草稿审核期间照常在线，构建失败也不会拖垮编辑。", "tags": ["CMS", "PostgreSQL"]}, {"c": "后端工程", "d": "2026-10-27", "r": 10, "t": "PostgreSQL 迁移里那些会悄悄锁表的语句", "e": "加列带默认值、建索引、改约束：哪些在新版本里已经安全，哪些仍要分步执行。", "tags": ["PostgreSQL", "CI/CD"]}, {"c": "Rust", "d": "2026-10-02", "r": 9, "t": "在 Worker 里安全地重试 GitHub API", "e": "每日采集只要有一次失败就不发布该批次，重试也不能生成重复的快照。", "tags": ["PostgreSQL", "MCP"]}];
const list = document.getElementById('post-list');
const photos = [...document.querySelectorAll('#list-photo [data-ph]')];
list.innerHTML = POSTS.map((p, i) => `
  <li>
    <a href="blog-detail.html" class="block py-5 no-underline" data-i="${i}" aria-describedby="pd-${i}">
      <span class="flex items-baseline justify-between gap-6">
        <span class="row-title t-lead muted transition-colors duration-300">${p.t}</span>
        <time class="t-small muted shrink-0" datetime="${p.d}">${p.d.slice(5)}</time>
      </span>
      <span class="block t-small muted mt-1">${p.c} · ${p.r} 分钟</span>
      <span id="pd-${i}" class="row-desc block mt-3 max-w-[32em]" hidden>${p.e}<span class="block t-small muted mt-2">${p.tags.map(t => '#' + t).join('　')}</span></span>
    </a>
  </li>`).join('');
[...list.children].forEach((li, i) => li.style.setProperty('--n', i));
const rows = [...list.querySelectorAll('a[data-i]')];
let cur = -1;
function activate(i) {
  if (i === cur) return; cur = i;
  rows.forEach((r, j) => {
    const t = r.querySelector('.row-title');
    t.classList.toggle('ink', j === i); t.classList.toggle('muted', j !== i);
    r.querySelector('.row-desc').hidden = j !== i;
  });
  photos.forEach((ph, j) => { ph.classList.toggle('opacity-100', j === i); ph.classList.toggle('opacity-0', j !== i); });
}
rows.forEach(r => { const i = +r.dataset.i; r.addEventListener('mouseenter', () => activate(i)); r.addEventListener('focus', () => activate(i)); });
const rowIO = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && activate(+e.target.dataset.i)), { rootMargin: '-45% 0px -45% 0px' });
rows.forEach(r => rowIO.observe(r));
activate(0);

// 手机/平板：分类标签折叠区（桌面始终展开，所以切换 class 而不是 hidden 属性）
const tg = document.getElementById('taxo-toggle'), panel = document.getElementById('taxo-panel');
tg.addEventListener('click', () => {
  const open = panel.classList.toggle('hidden') === false;
  tg.setAttribute('aria-expanded', open);
  document.getElementById('taxo-sign').textContent = open ? '－' : '＋';
});
</script>

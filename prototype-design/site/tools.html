<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具 · Silva</title>
  <meta name="description" content="W08 工具导航原型：页标题、可选精选区、分类锚点与分组卡片；工具直接打开配置的外部链接。">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../assets/tw-config.js"></script>
  <link rel="stylesheet" href="../assets/base.css">
  <style>.tool-group { scroll-margin-top: 136px; }</style>
</head>
<body class="bg-paper text-ink font-sans antialiased" data-nav="tools"
      data-proto-states="default:有精选;nofeatured:无精选">
<div id="site-header"></div>

<main id="main" class="max-w-site mx-auto px-4 md:px-8">
  <header class="pt-12 md:pt-20 pb-8">
    <h1 class="font-serif text-[40px] md:text-[56px] font-black leading-tight">工具</h1>
    <p class="mt-4 text-[16px] leading-8 text-ink-2 max-w-[36em]">日常写代码、排查问题和写作时真正在用的工具。点击卡片会在新标签页打开工具的官网。</p>
  </header>

  <section data-state="default" aria-labelledby="featured-title" class="pb-12">
    <h2 id="featured-title" class="text-[15px] text-ink-soft">最常打开的</h2>
    <ul id="featured" class="mt-4 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></ul>
  </section>

  <!-- 分类锚点：吸顶 -->
  <nav aria-label="工具分类" class="sticky top-16 z-30 -mx-4 md:-mx-8 px-4 md:px-8 bg-paper/95 backdrop-blur border-y border-rule">
    <ul id="anchors" class="flex gap-1 overflow-x-auto py-2.5 text-[14px] whitespace-nowrap"></ul>
  </nav>

  <div id="groups" class="pt-4"></div>
</main>

<div id="site-footer"></div>
<script src="../assets/site.js"></script>
<script>
  const GROUPS = [
    { id: 'dev', name: '开发与调试', items: [
      { n: 'Neovim', d: '主力编辑器，配置放在 dotfiles 里。', u: 'neovim.io', f: true },
      { n: 'Bruno', d: '本地优先的 API 调试客户端，请求集合可以提交到 Git。', u: 'usebruno.com' },
      { n: 'just', d: '比 Makefile 更顺手的命令运行器。', u: 'just.systems' },
      { n: 'Wezterm', d: '用 Lua 配置的终端。', u: 'wezfurlong.org' },
    ] },
    { id: 'db', name: '数据库', items: [
      { n: 'pgcli', d: '带补全和高亮的 PostgreSQL 命令行。', u: 'pgcli.com', f: true },
      { n: 'explain.dalibo.com', d: '可视化 EXPLAIN ANALYZE 结果。', u: 'explain.dalibo.com' },
    ] },
    { id: 'ops', name: '可观测与运维', items: [
      { n: 'Grafana', d: '看指标和日志的面板。', u: 'grafana.com' },
      { n: 'hyperfine', d: '命令行基准测试，比较两个实现的耗时。', u: 'github.com', f: true },
    ] },
    { id: 'write', name: '写作与图表', items: [
      { n: 'Excalidraw', d: '手绘风格的架构草图。', u: 'excalidraw.com' },
      { n: 'Mermaid Live', d: '用文本写时序图和流程图。', u: 'mermaid.live' },
    ] },
    { id: 'other', name: '其他', items: [
      { n: 'regex101', d: '调试正则表达式，带逐步解释。', u: 'regex101.com' },
    ] },
  ];
  const ext = `<svg class="shrink-0 text-ink-soft group-hover:text-accent" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>`;
  const card = (t, big) => `<li><a href="https://${t.u}/" target="_blank" rel="noopener" class="group flex h-full flex-col rounded-md border border-rule ${big ? 'bg-paper-2/70 p-5' : 'bg-paper p-4'} hover:border-ink/40">
      <span class="flex items-start justify-between gap-3">
        <span class="flex items-center gap-3 min-w-0"><span class="grid place-items-center w-9 h-9 rounded bg-ink text-paper font-serif font-bold shrink-0" aria-hidden="true">${t.n[0].toUpperCase()}</span>
        <span class="font-medium text-[16px] truncate group-hover:text-accent">${t.n}</span></span>${ext}</span>
      <span class="mt-3 text-[14px] leading-6 text-ink-2">${t.d}</span>
      <span class="mt-auto pt-3 text-[12px] text-ink-soft">${t.u}<span class="sr-only">（外部链接，新标签页打开）</span></span></a></li>`;
  // 精选工具同时保留在所属分组
  document.getElementById('featured').innerHTML = GROUPS.flatMap(g => g.items.filter(i => i.f)).map(t => card(t, true)).join('');
  document.getElementById('anchors').innerHTML = GROUPS.map(g => `<li><a href="#${g.id}" data-anchor="${g.id}" class="inline-block px-3 py-1.5 rounded-full text-ink-2 hover:bg-paper-2">${g.name}<span class="ml-1 text-ink-soft tnum">${g.items.length}</span></a></li>`).join('');
  document.getElementById('groups').innerHTML = GROUPS.map(g => `
    <section id="${g.id}" class="tool-group pt-10" aria-labelledby="${g.id}-t">
      <h2 id="${g.id}-t" class="font-serif text-[24px] font-bold border-b border-ink pb-3">${g.name}</h2>
      <ul class="mt-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${g.items.map(t => card(t)).join('')}</ul>
    </section>`).join('');
  // 当前锚点高亮
  const anchors = document.querySelectorAll('[data-anchor]');
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    anchors.forEach(a => { const on = a.dataset.anchor === e.target.id; a.classList.toggle('bg-ink', on); a.classList.toggle('text-paper', on); a.classList.toggle('text-ink-2', !on); });
  }), { rootMargin: '-140px 0px -70% 0px' });
  document.querySelectorAll('.tool-group').forEach(s => io.observe(s));
</script>
<script src="../assets/proto.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具 · Silva</title>
  <meta name="description" content="W08 工具导航原型 v2：页标题、精选区、分类锚点与分组工具卡片。">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../assets/tw-config.js"></script>
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/site.css">
  <style>.seg > [aria-current="location"] { background:#fff; color:#09090B; box-shadow:0 1px 2px rgba(9,9,11,.08); font-weight:500; }</style>
</head>
<body class="site antialiased" data-nav="tools"
      data-proto-states="default:有精选;nofeatured:无精选">
<div id="site-header"></div>

<main id="main" class="max-w-site mx-auto px-4 md:px-6">
  <header class="pt-10 md:pt-16 pb-8 md:pb-10">
    <span class="tag tag-accent"><i data-icon="wrench" class="w-3.5 h-3.5"></i>工具导航</span>
    <h1 class="mt-4 font-display font-bold tracking-[-0.03em] text-[36px] md:text-[48px] leading-tight text-zinc-900">工具</h1>
    <p class="mt-3 text-[16px] leading-8 text-zinc-600 max-w-[36em]">日常写代码、排查问题和写作时真正在用的工具。点击卡片会在新标签页打开工具的官网。</p>
  </header>

  <!-- 精选：精选工具也保留在所属分组 -->
  <section data-state="default" aria-labelledby="featured-title" class="pb-10">
    <h2 id="featured-title" class="flex items-center gap-2 text-[14px] font-medium text-zinc-500"><i data-icon="star" class="w-4 h-4 text-amber-500"></i>最常打开的</h2>
    <ul id="featured" class="reveal mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 [&>*]:min-w-0"></ul>
  </section>

  <!-- 分类锚点：吸顶 -->
  <nav aria-label="工具分类" class="sticky top-16 z-30 -mx-4 md:-mx-6 px-4 md:px-6 py-3 bg-[#FAFAFA]/90 backdrop-blur-md border-b border-zinc-200/80">
    <div id="anchors" class="seg max-w-full overflow-x-auto whitespace-nowrap"></div>
  </nav>

  <div id="groups"></div>
</main>

<div id="site-footer"></div>
<script src="../assets/site.js"></script>
<script>
  const GROUPS = [
    { id: 'dev', name: '开发与调试', i: 'terminal', tone: 'bg-blue-50 text-blue-700', items: [
      { n: 'Neovim', d: '主力编辑器，配置放在 dotfiles 里。', u: 'neovim.io', f: true },
      { n: 'Bruno', d: '本地优先的 API 调试客户端，请求集合可以提交到 Git。', u: 'usebruno.com' },
      { n: 'just', d: '比 Makefile 更顺手的命令运行器。', u: 'just.systems' },
      { n: 'Wezterm', d: '用 Lua 配置的终端。', u: 'wezfurlong.org' },
    ] },
    { id: 'db', name: '数据库', i: 'layers', tone: 'bg-emerald-50 text-emerald-700', items: [
      { n: 'pgcli', d: '带补全和高亮的 PostgreSQL 命令行。', u: 'pgcli.com', f: true },
      { n: 'explain.dalibo.com', d: '可视化 EXPLAIN ANALYZE 结果。', u: 'explain.dalibo.com' },
    ] },
    { id: 'ops', name: '可观测与运维', i: 'trending-up', tone: 'bg-violet-50 text-violet-700', items: [
      { n: 'Grafana', d: '看指标和日志的面板。', u: 'grafana.com' },
      { n: 'hyperfine', d: '命令行基准测试，比较两个实现的耗时。', u: 'github.com', f: true },
    ] },
    { id: 'write', name: '写作与图表', i: 'book-open', tone: 'bg-amber-50 text-amber-700', items: [
      { n: 'Excalidraw', d: '手绘风格的架构草图。', u: 'excalidraw.com' },
      { n: 'Mermaid Live', d: '用文本写时序图和流程图。', u: 'mermaid.live' },
    ] },
    { id: 'other', name: '其他', i: 'folder', tone: 'bg-zinc-100 text-zinc-700', items: [
      { n: 'regex101', d: '调试正则表达式，带逐步解释。', u: 'regex101.com' },
    ] },
  ];
  const card = (t, g, big, i) => `<li ${big ? `style="--i:${i}"` : ''}>
    <a href="https://${t.u}/" target="_blank" rel="noopener" class="tile tile-link group h-full flex flex-col ${big ? 'p-6' : 'p-5'}">
      <span class="flex items-start justify-between gap-3">
        <span class="grid place-items-center ${big ? 'w-12 h-12 text-[18px]' : 'w-10 h-10 text-[16px]'} rounded-xl ${g.tone} font-display font-bold shrink-0" aria-hidden="true">${t.n[0].toUpperCase()}</span>
        <span class="flex items-center gap-1.5">
          ${t.f && !big ? `<span class="tag !bg-amber-50 !text-amber-700">${icon('star', 'w-3 h-3')}精选</span>` : ''}
          ${icon('arrow-up-right', 'w-4 h-4 text-zinc-400 group-hover:text-blue-600 transition-colors')}
        </span>
      </span>
      <span class="mt-4 font-display font-semibold ${big ? 'text-[19px]' : 'text-[17px]'} text-zinc-900 break-all group-hover:text-blue-700 transition-colors">${t.n}</span>
      <span class="mt-1.5 text-[14px] leading-6 text-zinc-600">${t.d}</span>
      <span class="mt-auto pt-4 flex items-center justify-between gap-2 text-[12px] text-zinc-500">
        <span class="font-mono truncate">${t.u}</span>${big ? `<span class="tag">${g.name}</span>` : ''}
      </span>
      <span class="sr-only">（外部链接，新标签页打开）</span>
    </a></li>`;
  document.getElementById('featured').innerHTML = GROUPS.flatMap(g => g.items.filter(i => i.f).map(t => [t, g])).map(([t, g], i) => card(t, g, true, i)).join('');
  document.getElementById('anchors').innerHTML = GROUPS.map(g => `<a href="#${g.id}" data-anchor="${g.id}" class="shrink-0">${g.name}<span class="ml-1.5 text-zinc-400 tnum">${g.items.length}</span></a>`).join('');
  document.getElementById('groups').innerHTML = GROUPS.map(g => `
    <section id="${g.id}" class="tool-group pt-10 md:pt-12 scroll-mt-32" aria-labelledby="${g.id}-t">
      <div class="flex items-center gap-3">
        <span class="grid place-items-center w-9 h-9 rounded-lg ${g.tone}">${icon(g.i, 'w-4 h-4')}</span>
        <h2 id="${g.id}-t" class="section-title text-[22px] md:text-[24px]">${g.name}</h2>
        <span class="text-[13px] text-zinc-500 tnum">${g.items.length} 个</span>
      </div>
      <ul class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 [&>*]:min-w-0">${g.items.map(t => card(t, g)).join('')}</ul>
    </section>`).join('');
  // 当前锚点高亮
  const anchors = document.querySelectorAll('[data-anchor]');
  const setActive = id => anchors.forEach(a => a.dataset.anchor === id ? a.setAttribute('aria-current', 'location') : a.removeAttribute('aria-current'));
  setActive(GROUPS[0].id);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }), { rootMargin: '-140px 0px -65% 0px' });
  document.querySelectorAll('.tool-group').forEach(s => io.observe(s));
</script>
<script src="../assets/proto.js"></script>
</body>
</html>

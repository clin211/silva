<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · Silva</title>
  <meta name="description" content="W09 公开 404 原型 v2：保留页头页脚，说明页面不存在或已下线，提供回首页与浏览文章。">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../assets/tw-config.js"></script>
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body class="site antialiased" data-nav="">
<div id="site-header"></div>

<main id="main" class="max-w-site mx-auto px-4 md:px-6">
  <section class="pt-10 md:pt-16">
    <div class="tile relative overflow-hidden px-6 py-14 md:px-12 md:py-20 text-center">
      <div class="absolute inset-0 dot-grid [mask-image:radial-gradient(ellipse_at_center,black,transparent_70%)] pointer-events-none" aria-hidden="true"></div>
      <div class="relative">
        <p class="font-mono font-medium text-[96px] md:text-[144px] leading-none tracking-[-0.04em] text-zinc-200 select-none" aria-hidden="true">404</p>
        <h1 class="mt-2 font-display font-bold tracking-[-0.02em] text-[28px] md:text-[40px] leading-tight text-zinc-900">这个页面不存在</h1>
        <p class="mt-4 mx-auto text-[16px] leading-8 text-zinc-600 max-w-[32em]">地址可能拼写有误，或者这篇内容已经下线。下线的内容不会再出现在列表、RSS 和站点地图里。</p>
        <div class="mt-8 flex flex-wrap justify-center gap-3">
          <a href="home.html" class="btn btn-primary"><i data-icon="home"></i>回首页</a>
          <a href="blog.html" class="btn btn-ghost"><i data-icon="book-open"></i>浏览文章</a>
        </div>
        <div class="mt-10 mx-auto max-w-sm rounded-xl bg-[#0B0F19] text-left font-mono text-[12px] leading-6 text-zinc-400 px-4 py-3" aria-hidden="true">
          <span class="text-zinc-500">$</span> curl -I /some/missing/page<br><span class="text-rose-300">HTTP/2 404</span>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="../assets/site.js"></script>
<script src="../assets/proto.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>技术文章 · Silva</title>
  <meta name="description" content="长林啊的技术文章：后端、前端、跨端与 AI 工程实践，按时间归档。">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../assets/tw-config.js"></script>
  <link rel="stylesheet" href="../assets/silva.css">
  <style>
    .search { position: relative; }
    .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search .input { padding-left: 44px; height: 52px; }
    .choice .cnt { margin-left: 6px; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .year { font-size: clamp(3rem, 2rem + 3vw, 4.5rem); line-height: .9; font-weight: 600; letter-spacing: -.03em; color: rgba(16, 37, 35, .1); font-variant-numeric: tabular-nums; }
    .month-label { position: sticky; top: 100px; }
    .arch-row { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr); gap: 16px; padding-block: 18px; }
    @media (min-width: 768px) { .arch-row { grid-template-columns: 4rem minmax(0, 1fr) 11rem; gap: 24px; align-items: baseline; } }
    .arch-row .meta { grid-column: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    @media (min-width: 768px) { .arch-row .meta { grid-column: 3; justify-content: flex-end; } }
    .arch-row:hover .day { color: var(--accent); }
  </style>
</head>
<body class="silva" data-nav="blog" data-proto-states="default:有文章;empty:暂无文章">
<div id="site-header"></div>

<main id="main" class="!pt-0">
  <!-- ===== Header band ===== -->
  <section class="band-mist pt-36 pb-14 md:pt-40 md:pb-16" aria-labelledby="page-title">
    <div class="wrap" data-rise>
      <span class="eyebrow">Writing · 归档</span>
      <div class="mt-5 grid gap-8 lg:grid-cols-12 lg:items-end">
        <div class="lg:col-span-7">
          <h1 id="page-title" class="text-5xl sm:text-6xl lg:text-7xl font-semibold leading-[.95]">技术文章</h1>
          <p class="t-lead ink-2 mt-5 max-w-[34em]">工程实践、学习笔记和踩坑记录。写下判断与取舍，让一次解决问题的经验可以被再次使用。</p>
        </div>
        <div class="lg:col-span-5" data-state="default">
          <label class="search block" for="q"><span class="sr-only">搜索文章</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" class="input" type="search" placeholder="搜索标题或摘要，如 Docker、RAG" autocomplete="off">
          </label>
          <p class="t-xs muted mt-2 pl-4">共 <span class="num">19</span> 篇 · 最近更新 2026-11-18</p>
        </div>
      </div>
      <div class="mt-8 overflow-x-auto -mx-4 px-4" data-state="default">
        <div class="choice" role="group" aria-label="按分类筛选" id="cats"></div>
      </div>
    </div>
  </section>

  <!-- ===== Archive timeline ===== -->
  <section data-state="default" class="wrap pt-16 md:pt-20 pb-6" aria-labelledby="arch-title">
    <div class="flex flex-wrap items-end justify-between gap-4 border-b border-[var(--line)] pb-5">
      <h2 id="arch-title" class="t-h2">全部文章</h2>
      <p class="t-small muted" id="arch-count" aria-live="polite"></p>
    </div>
    <div id="archive"></div>
    <div id="noresult" hidden class="panel mt-8 p-8 text-center">
      <p class="t-h3">没有找到相关文章</p>
      <p class="t-small muted mt-2">换个关键词，或者回到全部分类看看。</p>
      <button type="button" class="btn btn-dark btn-sm mt-5" id="reset">清除筛选</button>
    </div>
    <div class="mt-12 text-center" id="pager">
      <p class="t-small muted">已经到底了，所有文章都在这一页。</p>
    </div>
  </section>

  <!-- ===== Tags + RSS strip ===== -->
  <section data-state="default" class="wrap py-14" aria-label="标签与订阅">
    <div class="bezel"><div class="face p-5 md:p-6 grid gap-5 lg:grid-cols-[1fr_auto] lg:items-center">
      <div class="flex flex-wrap items-center gap-2">
        <span class="kicker mr-2">Tags</span>
        <a class="chip hash" href="tag.html">Go</a><a class="chip hash" href="tag.html">TypeScript</a><a class="chip hash" href="tag.html">Next.js</a><a class="chip hash" href="tag.html">Docker</a><a class="chip hash" href="tag.html">React Native</a><a class="chip hash" href="tag.html">RAG</a><a class="chip hash" href="tag.html">AI Agent</a><a class="chip hash" href="tag.html">工程化</a><a class="chip hash" href="tag.html">性能优化</a>
      </div>
      <a href="#rss" class="btn btn-dark btn-sm justify-self-start">订阅 RSS<span class="arrow">↗</span></a>
    </div></div>
  </section>

  <!-- ===== Empty ===== -->
  <section data-state="empty" hidden class="wrap py-24">
    <div class="max-w-xl mx-auto text-center">
      <div class="cover c-mist r-md w-28 h-28 mx-auto"><span class="cover-mark !text-5xl">0</span></div>
      <h2 class="t-h2 mt-8">还没有发布的文章</h2>
      <p class="ink-2 mt-3">第一篇正在写。可以先订阅 RSS，发布后会第一时间收到。</p>
      <div class="mt-8 flex justify-center gap-3"><a class="btn btn-dark" href="#rss">订阅 RSS</a><a class="btn btn-ghost" href="ai-trending.html">看看 AI 趋势</a></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="../assets/site.js"></script>
<script src="../assets/proto.js"></script>
<script>
const POSTS = [
  ['2026-11-18', '基于 GitHub Actions 与 Docker 的 Go 项目部署实战', '多阶段构建、镜像推送、远程部署与一键回滚。', '后端', 14],
  ['2026-11-10', '用不可变 revision 重写 CMS 的发布流程', '把保存、批准、上线拆成三个互不干扰的状态。', '后端', 12],
  ['2026-11-02', 'RAG 检索增强生成：向量检索与重排序实践', '切分策略、召回评估与重排序，一次可复现的对比。', 'AI 工程', 16],
  ['2026-10-21', 'Next.js 技术选型攻略：最佳实践与工具推荐', 'App Router、数据获取、样式方案与部署平台怎么选。', '前端', 11],
  ['2026-10-08', '函数调用与工具编排：让 Agent 稳定地做事', '工具描述、参数校验、失败重试与上下文裁剪。', 'AI 工程', 13],
  ['2026-09-26', '你必须知道的 45 个强大的 JavaScript 代码段', '数组、对象、异步与 DOM 的常用写法，附注意事项。', '前端', 9],
  ['2026-09-12', 'React Native 跨端应用上架六个商店的踩坑记录', '签名、隐私合规与各家审核规则的差异。', '跨端', 15],
  ['2026-08-30', 'Go + Gin 常用工程实践：分层、错误与日志', '目录结构、错误包装、结构化日志与 request ID。', '后端', 10],
  ['2026-08-15', 'TypeScript 高级类型体操：从条件类型到模板字面量', '用真实需求练类型推断，而不是为了炫技。', '前端', 12],
  ['2026-07-28', '关于持续学习的思考', '从追逐新框架，到先理解它解决了什么问题。', '随笔', 5],
  ['2026-07-09', 'UniApp 一套代码适配六端小程序的经验', '条件编译、分包加载与平台差异的处理方式。', '跨端', 8],
  ['2026-07-03', '本地开发环境一键启动：docker compose 实践', '数据库、缓存与服务依赖一条命令拉起，新人当天就能跑起来。', '工程化', 8],
  ['2026-06-14', 'PostgreSQL 迁移为什么会锁表', '加列、加索引、改类型分别拿什么锁，以及怎样拆成不阻塞线上的几步。', '后端', 11],
  ['2026-05-02', '在 Worker 里安全地重试 GitHub API', '限流、退避与幂等：每日采集失败就不发布该批次，重试也不生成重复快照。', '后端', 10],
  ['2026-04-18', '镜像从 900MB 到 20MB', '多阶段构建、静态编译与 distroless 基础镜像，一步步把 Go 服务镜像瘦下来。', '工程化', 7],
  ['2026-03-20', '结构化日志与 request ID 贯穿全链路', '从网关到 Worker，让一次请求的日志能被一条 ID 串起来。', '后端', 9],
  ['2025-12-20', '2025 年度回顾：从全栈到 AI 应用', '这一年做过的事、读过的书，以及没做成的部分。', '随笔', 7],
  ['2025-11-30', 'Webpack 5 构建提速 40% 的几处改动', '缓存、Tree Shaking 与产物分析，构建时间和包体积都降了下来。', '前端', 9],
  ['2025-11-06', '提示工程与输出对齐：减少幻觉的模板', '结构化输出、示例选择与自检步骤。', 'AI 工程', 10],
];
const CATS = ['全部', '后端', '前端', '跨端', 'AI 工程', '工程化', '随笔'];
const CHIP = { '后端': 'chip-teal', '前端': '', '跨端': 'chip-sun', 'AI 工程': 'chip-coral', '工程化': 'chip-teal', '随笔': '' };
let cat = '全部', q = '';
const catsEl = document.getElementById('cats');
catsEl.innerHTML = CATS.map(c => `<button type="button" data-cat="${c}" aria-pressed="${c === cat}">${c}<span class="cnt">${c === '全部' ? POSTS.length : POSTS.filter(p => p[3] === c).length}</span></button>`).join('');

function render() {
  const kw = q.trim().toLowerCase();
  const list = POSTS.filter(p => (cat === '全部' || p[3] === cat) && (!kw || (p[1] + p[2]).toLowerCase().includes(kw)));
  const byYear = {};
  list.forEach(p => { const [y, m] = p[0].split('-'); ((byYear[y] ||= {})[m] ||= []).push(p); });
  document.getElementById('archive').innerHTML = Object.keys(byYear).sort().reverse().map(y => `
    <div class="grid gap-4 md:grid-cols-[11rem_minmax(0,1fr)] md:gap-8 pt-10">
      <div><p class="year md:sticky md:top-28">${y}</p></div>
      <div>${Object.keys(byYear[y]).sort().reverse().map(m => `
        <div class="mb-6">
          <p class="kicker mb-1">${+m} 月 · ${byYear[y][m].length} 篇</p>
          <ol class="rows list-none p-0">${byYear[y][m].map(p => `
            <li><a href="blog-detail.html" class="group arch-row">
              <span class="day mono t-small muted num transition-colors">${p[0].slice(5)}</span>
              <span class="min-w-0"><span class="block font-semibold text-[1.0625rem] leading-snug hover-accent">${p[1]}</span><span class="block t-small muted mt-1 truncate">${p[2]}</span></span>
              <span class="meta"><span class="chip ${CHIP[p[3]]}">${p[3]}</span><span class="t-xs muted whitespace-nowrap">${p[4]} 分钟</span></span>
            </a></li>`).join('')}
          </ol>
        </div>`).join('')}
      </div>
    </div>`).join('');
  document.getElementById('arch-count').textContent = (cat === '全部' && !kw) ? `共 ${POSTS.length} 篇，按时间倒序` : `找到 ${list.length} 篇`;
  document.getElementById('noresult').hidden = list.length > 0;
  document.getElementById('pager').hidden = list.length === 0;
}
catsEl.addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  cat = b.dataset.cat; catsEl.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value; render(); });
document.getElementById('reset').addEventListener('click', () => { q = ''; document.getElementById('q').value = ''; catsEl.querySelector('[data-cat="全部"]').click(); });
render();
</script>
</body>
</html>

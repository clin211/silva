<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后端工程 · 分类 · Silva</title>
  <meta name="description" content="W04 分类文章列表原型：面包屑、分类名称与文章数、复用文章列表与分类/标签导航。">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../assets/tw-config.js"></script>
  <link rel="stylesheet" href="../assets/base.css">
</head>
<body class="bg-paper text-ink font-sans antialiased" data-nav="blog"
      data-proto-states="default:有文章;empty:分类下暂无文章">
<div id="site-header"></div>

<main id="main" class="max-w-site mx-auto px-4 md:px-8">
  <header class="pt-8 md:pt-12 pb-8 border-b border-ink">
    <nav aria-label="面包屑"><ol class="flex flex-wrap items-center gap-2 text-[13px] text-ink-soft">
      <li><a href="home.html" class="hover:text-accent">首页</a></li><li aria-hidden="true">/</li>
      <li><a href="blog.html" class="hover:text-accent">文章</a></li><li aria-hidden="true">/</li>
      <li aria-current="page" class="text-ink">分类：后端工程</li></ol></nav>
    <p class="mt-8 text-[14px] text-ink-soft">分类</p>
    <h1 class="mt-1 font-serif text-[40px] md:text-[56px] font-black leading-tight">后端工程</h1>
    <p class="mt-3 text-[16px] leading-8 text-ink-2 max-w-[36em]"><span class="tnum">2</span> 篇文章。服务端架构、数据一致性、发布与运维相关的实践记录。</p>
  </header>

  <div class="lg:grid lg:grid-cols-12 lg:gap-12 pt-8">
    <!-- 侧栏：手机/平板折叠在列表前；桌面在右栏 -->
    <aside class="lg:col-span-4 lg:order-2" aria-label="分类与标签">
      <button type="button" class="lg:hidden w-full flex items-center justify-between py-3 px-4 border border-rule rounded-md text-[15px] bg-paper-2/60" onclick="const p=document.getElementById('taxo-panel');p.classList.toggle('hidden');this.setAttribute('aria-expanded',!p.classList.contains('hidden'))" aria-expanded="false" aria-controls="taxo-panel">
        <span>按分类或标签浏览</span><span aria-hidden="true">▾</span>
      </button>
      <div id="taxo-panel" class="hidden lg:block lg:sticky lg:top-24 mt-4 lg:mt-0">
        <h2 class="text-[14px] text-ink-soft">分类</h2>
        <ul class="mt-3 divide-y divide-rule border-y border-rule text-[15px]">
          <li><a href="category.html" aria-current="page" class="flex justify-between py-2.5 text-accent font-medium"><span>后端工程</span><span class="tnum text-ink-soft">14</span></a></li>
          <li><a href="category.html" class="flex justify-between py-2.5 hover:text-accent"><span>Rust</span><span class="tnum text-ink-soft">9</span></a></li>
          <li><a href="category.html" class="flex justify-between py-2.5 hover:text-accent"><span>前端</span><span class="tnum text-ink-soft">7</span></a></li>
          <li><a href="category.html" class="flex justify-between py-2.5 hover:text-accent"><span>工程随笔</span><span class="tnum text-ink-soft">5</span></a></li>
        </ul>
        <h2 class="mt-8 text-[14px] text-ink-soft">标签</h2>
        <ul class="mt-3 flex flex-wrap gap-2 text-[14px]">
          <li><a href="tag.html" class="inline-block px-3 py-1 rounded-full border border-rule hover:border-accent hover:text-accent">PostgreSQL</a></li>
          <li><a href="tag.html" class="inline-block px-3 py-1 rounded-full border border-rule hover:border-accent hover:text-accent">Axum</a></li>
          <li><a href="tag.html" class="inline-block px-3 py-1 rounded-full border border-rule hover:border-accent hover:text-accent">Astro</a></li>
          <li><a href="tag.html" class="inline-block px-3 py-1 rounded-full border border-rule hover:border-accent hover:text-accent">CMS</a></li>
          <li><a href="tag.html" class="inline-block px-3 py-1 rounded-full border border-rule hover:border-accent hover:text-accent">可观测性</a></li>
          <li><a href="tag.html" class="inline-block px-3 py-1 rounded-full border border-rule hover:border-accent hover:text-accent">MCP</a></li>
          <li><a href="tag.html" class="inline-block px-3 py-1 rounded-full border border-rule hover:border-accent hover:text-accent">CI/CD</a></li>
        </ul>
      </div>
    </aside>

    <section class="lg:col-span-8 lg:order-1 mt-6 lg:mt-0" aria-label="文章列表">
      <div data-state="default">
        <ol id="post-list" class="divide-y divide-rule"></ol>
      </div>
      <div data-state="empty" hidden class="py-16 border-y border-rule">
        <p class="font-serif text-[22px]">这个分类下还没有已上线的文章。</p>
        <p class="mt-2 text-ink-soft text-[15px]">文章发布并完成站点构建后会出现在这里。可以先看看<a href="projects.html" class="text-accent underline underline-offset-4">项目</a>或<a href="tools.html" class="text-accent underline underline-offset-4">工具</a>。</p>
      </div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="../assets/site.js"></script>
<script src="../assets/proto.js"></script>
<script>
  // 原型数据（真实页面由构建快照生成）
  const POSTS = [
    { c: '后端工程', d: '2026-11-18', t: '用不可变 revision 重写 CMS 的发布流程：草稿、审核与上线的三条线', e: '把「保存」「批准」「上线」拆成三个独立状态之后，旧版本可以在新草稿审核期间继续在线。', cover: true },
    { c: 'Rust', d: '2026-11-12', t: 'Axum 中间件的执行顺序，一张图讲清楚', e: '从 Layer 的包裹方向说起，顺便整理 request ID 与 tracing 的放置位置。' },
    { c: '前端', d: '2026-11-03', t: '静态优先的 Astro 站点，什么时候才需要 Island', e: '筛选、分页和图表之外，几乎所有页面都可以在构建时完成。', cover: true },
    { c: '后端工程', d: '2026-10-27', t: 'PostgreSQL 迁移里那些会悄悄锁表的语句', e: 'ADD COLUMN 带默认值、创建索引、改约束——哪些在新版本里已经安全，哪些仍需要分步执行。' },
    { c: '工程随笔', d: '2026-10-15', t: '一个人维护一个站点：我如何安排发布与回滚', e: '没有整站回滚时，重新发布一个历史已批准版本是最稳妥的恢复方式。' },
    { c: 'Rust', d: '2026-10-02', t: '在 Worker 进程里安全地重试 GitHub API：限流、退避与幂等批次', e: '每日采集只要一次失败就不发布该批次，重试也不能生成重复快照。' },
  ];
  POSTS.splice(0, POSTS.length, ...POSTS.filter(p => p.c === '后端工程'));
  const fmt = d => { const [y, m, day] = d.split('-'); return `${y} 年 ${+m} 月 ${+day} 日`; };
  document.getElementById('post-list').innerHTML = POSTS.map(p => `
    <li class="py-7 first:pt-0">
      <article class="grid ${p.cover ? 'sm:grid-cols-[1fr_200px]' : ''} gap-5 items-start">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-[13px] text-ink-soft">
            <a href="category.html" class="text-accent hover:underline underline-offset-4">${p.c}</a>
            <time class="tnum" datetime="${p.d}">${fmt(p.d)}</time>
          </div>
          <h2 class="mt-2 font-serif text-[21px] md:text-[24px] leading-snug font-bold"><a href="blog-detail.html" class="hover:text-accent">${p.t}</a></h2>
          <p class="mt-2 text-[15px] leading-7 text-ink-2">${p.e}</p>
        </div>
        ${p.cover ? `<a href="blog-detail.html" tabindex="-1" aria-hidden="true" class="hidden sm:block aspect-[4/3] rounded-md bg-paper-3 overflow-hidden"><svg class="w-full h-full" data-cover preserveAspectRatio="xMidYMid slice"></svg></a>` : ''}
      </article>
    </li>`).join('');
  document.querySelectorAll('[data-cover]').forEach((s, i) => drawContours(s, { seed: 11 + i, rings: 18, step: 26, cx: 300, cy: 300, highlight: 6, animate: false }));
</script>
</body>
</html>

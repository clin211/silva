# 三个入口独立监听，由外层 HTTPS 网关按公开域、管理域及运维网络选择端口。
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_http_version 1.1;

server {
    listen 8088 default_server;
    location ^~ /api/v1/public/ {
        proxy_pass http://api:8088/api/v1/public/;
    }
    location ~ ^/(api|internal|health|metrics)(/|$) { return 404; }
    location / { proxy_pass http://website:4321; }
}

server {
    listen 8089 default_server;
    client_max_body_size 16m;
    location ^~ /api/v1/admin/ {
        proxy_pass http://api:8088/api/v1/admin/;
    }
    location / { return 404; }
}

server {
    listen 8090 default_server;
    location = /health/live { proxy_pass http://api:8088/health/live; }
    location = /metrics { proxy_pass http://api:8088/metrics; }
    location / { return 404; }
}

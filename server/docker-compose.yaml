name: silva

x-backend: &backend
  image: silva-backend:local
  build:
    context: .
  init: true
  environment: &backend-env
    DATABASE_URL: postgres://silva:silva@postgres:5432/silva
    SILVA_BIND: 0.0.0.0:8088
    SILVA_ENV: development
    SILVA_DB_MAX_CONNECTIONS: ${SILVA_DB_MAX_CONNECTIONS:-10}
    # 未设置时 API 使用随机密钥（仅限开发），重启后令牌失效。
    SILVA_JWT_SECRET: ${SILVA_JWT_SECRET:-}
    SILVA_ACCESS_TOKEN_TTL_SECONDS: ${SILVA_ACCESS_TOKEN_TTL_SECONDS:-900}
    SILVA_REFRESH_TOKEN_TTL_SECONDS: ${SILVA_REFRESH_TOKEN_TTL_SECONDS:-604800}
    SILVA_WORKER_INTERVAL_SECONDS: ${SILVA_WORKER_INTERVAL_SECONDS:-60}
    SILVA_API_RATE_PER_MINUTE: ${SILVA_API_RATE_PER_MINUTE:-600}
    SILVA_LOGIN_RATE_PER_MINUTE: ${SILVA_LOGIN_RATE_PER_MINUTE:-10}
    # 媒体对象存储，未设置时媒体上传不可用；生产环境通过 Secret 注入。
    SILVA_STORAGE_PROVIDER: ${SILVA_STORAGE_PROVIDER:-}
    SILVA_STORAGE_ENDPOINT: ${SILVA_STORAGE_ENDPOINT:-}
    SILVA_STORAGE_BUCKET: ${SILVA_STORAGE_BUCKET:-}
    SILVA_STORAGE_REGION: ${SILVA_STORAGE_REGION:-auto}
    SILVA_STORAGE_ROOT: ${SILVA_STORAGE_ROOT:-/}
    SILVA_STORAGE_ACCESS_KEY_ID: ${SILVA_STORAGE_ACCESS_KEY_ID:-}
    SILVA_STORAGE_ACCESS_KEY_SECRET: ${SILVA_STORAGE_ACCESS_KEY_SECRET:-}
    SILVA_MEDIA_UPLOAD_TTL_SECONDS: ${SILVA_MEDIA_UPLOAD_TTL_SECONDS:-900}
    RUST_LOG: ${RUST_LOG:-info}
  profiles: [app]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: silva
      POSTGRES_USER: silva
      POSTGRES_PASSWORD: silva
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U silva -d silva"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [silva-cli, migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: [silva-api]
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8088/health/live]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command: [silva-worker]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:

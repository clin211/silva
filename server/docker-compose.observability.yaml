# 本地完整观测栈；所有对宿主机开放的管理端口仅绑定回环地址。
x-observability: &observability
  profiles: [observability]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      SILVA_WORKER_METRICS_BIND: 0.0.0.0:9091

  observability-init:
    profiles: [observability]
    image: busybox:1.37.0
    user: "0:0"
    read_only: true
    command: [sh, -ec, "chown 10001:10001 /data"]
    volumes:
      - otel-data:/data
    restart: "no"

  otel-collector:
    <<: *observability
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: [--config=/etc/otel/config.yaml]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
      - otel-data:/var/lib/otelcol
    ports:
      - "127.0.0.1:4318:4318"
    mem_limit: 512m
    depends_on:
      observability-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    <<: *observability
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ./observability/alerts.test.yaml:/etc/prometheus/alerts.test.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [alertmanager, blackbox, postgres-exporter, otel-collector]

  loki:
    <<: *observability
    image: grafana/loki:3.7.10
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  tempo:
    <<: *observability
    image: grafana/tempo:3.1.1
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    <<: *observability
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-silva-observability-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus, loki, tempo]

  alertmanager:
    <<: *observability
    image: prom/alertmanager:v0.35.0
    command: [--config.file=/etc/alertmanager/alertmanager.yaml, --storage.path=/alertmanager]
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on: [alert-receiver]

  alert-receiver:
    <<: *observability
    image: silva-observability-tools:local
    build:
      context: .
      target: observability-tools
    command: [silva-xtask, alert-receiver]
    init: true
    read_only: true
    ports:
      - "127.0.0.1:9094:9094"

  blackbox:
    <<: *observability
    image: prom/blackbox-exporter:v0.29.1
    command: [--config.file=/etc/blackbox/config.yaml]
    volumes:
      - ./observability/blackbox.yaml:/etc/blackbox/config.yaml:ro

  postgres-exporter:
    <<: *observability
    image: prometheuscommunity/postgres-exporter:v0.21.1
    environment:
      # 开发数据库凭据；生产必须使用独立监控角色和 Secret。
      DATA_SOURCE_NAME: postgres://silva:silva@postgres:5432/silva?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  otel-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  alertmanager-data:

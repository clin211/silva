rule_files: [/etc/prometheus/alerts.yaml]
evaluation_interval: 15s
tests:
  - name: 低流量错误不会触发错误率告警
    interval: 30s
    input_series:
      - series: silva_http_requests_total{job="silva-api",traffic="application",status="500"}
        values: 0+1x30
    promql_expr_test:
      - expr: ALERTS{alertname="SilvaHighErrorRate",alertstate="firing"}
        eval_time: 10m
        exp_samples: []
  - name: 健康探测错误不计入业务错误率
    interval: 30s
    input_series:
      - series: silva_http_requests_total{job="silva-api",traffic="operations",status="500"}
        values: 0+100x30
    promql_expr_test:
      - expr: ALERTS{alertname="SilvaHighErrorRate",alertstate="firing"}
        eval_time: 10m
        exp_samples: []
  - name: 持续业务错误触发告警
    interval: 30s
    input_series:
      - series: silva_http_requests_total{job="silva-api",traffic="application",status="500"}
        values: 0+20x30
      - series: silva_http_requests_total{job="silva-api",traffic="application",status="200"}
        values: 0+80x30
    promql_expr_test:
      - expr: ALERTS{alertname="SilvaHighErrorRate",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="SilvaHighErrorRate",alertstate="firing",severity="critical"}'
            value: 1
  - name: Worker 启动宽限后检测多个实例停滞
    interval: 30s
    input_series:
      - series: silva_worker_last_success_timestamp_seconds{job="silva-worker",instance="a"}
        values: 0+0x20
      - series: silva_process_start_time_seconds{job="silva-worker",instance="a"}
        values: 0+0x20
      - series: silva_worker_interval_seconds{job="silva-worker",instance="a"}
        values: 60+0x20
      - series: up{job="silva-worker",instance="a"}
        values: 1+0x20
      - series: silva_worker_last_success_timestamp_seconds{job="silva-worker",instance="b"}
        values: 0+0x20
      - series: silva_process_start_time_seconds{job="silva-worker",instance="b"}
        values: 0+0x20
      - series: silva_worker_interval_seconds{job="silva-worker",instance="b"}
        values: 60+0x20
      - series: up{job="silva-worker",instance="b"}
        values: 1+0x20
    promql_expr_test:
      - expr: ALERTS{alertname="SilvaWorkerStalled",alertstate="firing"}
        eval_time: 2m
        exp_samples: []
      - expr: ALERTS{alertname="SilvaWorkerStalled",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="SilvaWorkerStalled",alertstate="firing",severity="critical",job="silva-worker",instance="a"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="SilvaWorkerStalled",alertstate="firing",severity="critical",job="silva-worker",instance="b"}'
            value: 1
  - name: 同步发布写入故障与内部快照读取故障可独立观测
    interval: 30s
    input_series:
      - series: silva_http_requests_total{job="silva-api",route="/api/v1/admin/posts/{id}/publication",method="PUT",status="500"}
        values: 0+1x30
      - series: silva_http_requests_total{job="silva-api",route="/internal/site-snapshot",method="GET",status="503"}
        values: 0+1x30
      - series: silva_http_request_duration_seconds_bucket{job="silva-api",route="/api/v1/admin/series/{id}/publication",method="DELETE",le="1"}
        values: 0+0x30
      - series: silva_http_request_duration_seconds_bucket{job="silva-api",route="/api/v1/admin/series/{id}/publication",method="DELETE",le="5"}
        values: 0+5x30
      - series: silva_http_request_duration_seconds_bucket{job="silva-api",route="/api/v1/admin/series/{id}/publication",method="DELETE",le="+Inf"}
        values: 0+5x30
    promql_expr_test:
      - expr: ALERTS{alertname="SilvaPublicationErrors",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="SilvaPublicationErrors",alertstate="firing",severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="SilvaPublicationSlow",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="SilvaPublicationSlow",alertstate="firing",severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="SilvaSnapshotErrors",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="SilvaSnapshotErrors",alertstate="firing",severity="warning"}'
            value: 1
  - name: 只有日志导出失败也能触发告警
    interval: 30s
    input_series:
      - series: otelcol_exporter_send_failed_log_records{exporter="otlp_http/loki"}
        values: 0+10x30
    promql_expr_test:
      - expr: ALERTS{alertname="SilvaTelemetryExportFailed",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="SilvaTelemetryExportFailed",alertstate="firing",severity="warning",exporter="otlp_http/loki"}'
            value: 1

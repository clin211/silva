[workspace]
members = ["apps/api", "apps/worker", "apps/cli", "crates/shared", "crates/domain", "crates/application", "crates/infrastructure", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
silva-shared = { path = "crates/shared" }
silva-domain = { path = "crates/domain" }
silva-application = { path = "crates/application" }
silva-infrastructure = { path = "crates/infrastructure" }
ammonia = "4.2.5"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
http = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rand = "0.8"
reqsign-aliyun-oss = { version = "3.2.2", default-features = false }
reqsign-aws-v4 = { version = "3.5.0", default-features = false }
reqsign-core = { version = "3.3.4", default-features = false }
mime_guess = "2.0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
opendal = { version = "0.59.5", default-features = false, features = ["services-s3", "services-oss", "executors-tokio", "http-transport-reqwest-rustls", "layers-retry", "layers-timeout"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-appender-tracing = { version = "0.33", features = ["experimental_span_attributes"] }
tracing-opentelemetry = "0.34"
prometheus = { version = "0.14", default-features = false, features = ["process"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
needless_collect = "warn"
redundant_clone = "warn"
todo = "deny"

[profile.release]
lto = "thin"
strip = true
